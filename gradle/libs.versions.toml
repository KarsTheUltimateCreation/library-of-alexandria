# Versions track keiyoushi/extensions-source so the extension compiles against
# the same host-provided libraries that Mihon / Tachimanga ship at runtime.
[versions]
android-gradle = "9.5.0"
kotlin = "2.4.10"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
jsoup = "1.22.2"
junit = "4.13.2"

[libraries]
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-gradle" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "android-gradle" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
injekt-core = { module = "com.github.null2264.injekt:injekt-core", version = "4135455a2a" }
# extensions-lib 1.6 stubs (same pin as keiyoushi/extensions-source)
tachiyomi-lib = { module = "com.github.keiyoushi:extensions-lib", version = "42255ee5fa" }

junit = { module = "junit:junit", version.ref = "junit" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[bundles]
# Provided by the host app at runtime. Must never be bundled into the APK/JAR.
host-provided = ["kotlin-stdlib", "coroutines-core", "kotlin-json", "okhttp", "jsoup", "jspecify"]
