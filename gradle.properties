org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# The host app provides kotlin-stdlib. Bundling a second copy breaks class identity
# under Mihon's DelegateLastClassLoader, so it is added explicitly as compileOnly.
kotlin.stdlib.default.dependency=false
# The out-of-process Kotlin daemon intermittently failed to release incremental caches here.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
